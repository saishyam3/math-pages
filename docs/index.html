<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Math Demo – Curve Visualization</title>

  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <h1>Test Case 001: Curve + Equation</h1>

  <p>Equation:</p>
  <p>$$ f(x) = x^2 $$</p>

  <div id="plot" style="width:700px;height:450px;"></div>

  <script>
    const x = [];
    const y = [];
    for (let i = -10; i <= 10; i += 0.1) {
      x.push(i);
      y.push(i * i);
    }

    Plotly.newPlot("plot", [{
      x, y,
      mode: "lines",
      name: "f(x) = x^2"
    }], {
      title: "y = x²"
    });
  </script>
</body>
</html>
